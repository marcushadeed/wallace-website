# Home Group calendar, shown below the group listings. Replaced yearly.
# An entry with no "when" (e.g. "Break for Advent") shows as a break.
title: Home Group Calendar, Fall 2026 – Spring 2027
intro: |-
  This calendar is a suggested template for Home Groups meeting twice a month. Home Groups are free to meet more often or on a different pattern, so long as they meet at least twice a month. This calendar is to provide you with structure, but we want you to be free to improvise on that.

  If Home Groups desire more frequent fellowship, there are also other options beyond simply scheduling more regular meetings. Individuals in the group could go out for coffee to build one-on-one relationships. Or the group could go on fun activities or schedule a special party.
